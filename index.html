<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Soundboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="nav">
      <span class="wordmark">SOUNDBOARD</span>
    </div>
    <div class="header-inner">
      <div class="controls">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            id="search"
            class="search"
            type="search"
            placeholder="Search"
            autocomplete="off"
            aria-label="Search sounds"
          />
        </div>
        <div class="volume">
          <label for="volume" aria-label="Volume">Volume</label>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" />
        </div>
        <button id="stop-all" class="stop-all" type="button">Stop All</button>
      </div>
    </div>
  </header>

  <nav id="tabs" class="tabs" aria-label="Categories"></nav>

  <main id="board" class="board" aria-live="polite">
    <p class="status" id="status">Loading sounds…</p>
  </main>

  <footer class="app-footer">
    <span>Edit <code>sounds.json</code> to add sounds — no code changes needed.</span>
  </footer>


  <script src="./app.js"></script>
</body>
</html>
