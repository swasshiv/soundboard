<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1115" />
  <title>Soundboard</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="title">🎛️ Soundboard</h1>
    <div class="controls">
      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search sounds…"
        autocomplete="off"
        aria-label="Search sounds"
      />
      <div class="volume">
        <label for="volume" aria-label="Volume">🔊</label>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" />
      </div>
      <button id="stop-all" class="stop-all" type="button">■ Stop All</button>
    </div>
  </header>

  <nav id="tabs" class="tabs" aria-label="Categories"></nav>

  <main id="board" class="board" aria-live="polite">
    <p class="status" id="status">Loading sounds…</p>
  </main>

  <footer class="app-footer">
    <span>Edit <code>sounds.json</code> to add sounds — no code changes needed.</span>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
